description = "Execute the implementation planning workflow using the plan template to generate design artifacts."

prompt = """
---
description: Execute the implementation planning workflow using the plan template to generate design artifacts.
handoffs: 
  - label: 建立任務 (Create Tasks)
    agent: speckit.tasks
    prompt: 請根據計畫分解出具體的實作任務 (Break the plan into tasks)
    send: true
  - label: 建立檢查清單 (Create Checklist)
    agent: speckit.checklist
    prompt: 請為以下領域建立檢查清單 (Create a checklist for the following domain...)
---

## User Input

```text
$ARGUMENTS
```

You **MUST** consider the user input before proceeding (if not empty).

## Yucom Project Standards (MUST FOLLOW)

All plans for the **Yucom Audit System (悠康電子服務紀錄稽核系統)** must adhere to these standards:

### 1. Language & Format
- **Strict Requirement**: All planning artifacts (research, data model, contracts, designs) **MUST** be written in **Traditional Chinese (zh-TW)**.
- Use professional medical/audit terminology.

### 2. Technical Stack (Tech Stack)
- **Frontend**: React 18 (TypeScript), Vite, Tailwind CSS.
- **PDF Engine**: `pdf.js` (via `react-pdf-viewer`).
- **Backend**: Python 3.10+, `pdfplumber`, FastAPI (Localhost).
- **Communication**: Local RESTful API.

### 3. UI/UX Design (Yucom Style)
- **Colors**: 草本綠 (`#7FB069`), 溫潤米色 (`#F8F7F2`), 純白 (`#FFFFFF`), 警示紅 (`#E63946`), 暖橘色 (`#F4A261`).
- **Typography**: Noto Sans TC.
- **Constraints**: **NO character illustrations**. Fixed Dual-Column (75%/25%).

### 4. Privacy & Logic
- **Memory-Only**: Plans must reflect zero-disk storage for PDF data.
- **Logic**: All technical designs must account for **YC logical rules** and precise **coordinate-to-canvas mapping**.

## Outline

1. **Setup**: Run `.specify/scripts/powershell/setup-plan.ps1 -Json` from repo root and parse JSON for FEATURE_SPEC, IMPL_PLAN, SPECS_DIR, BRANCH.

2. **Load context**: Read FEATURE_SPEC and `.specify/memory/constitution.md`. Load IMPL_PLAN template (already copied).

3. **Execute plan workflow**: Follow the structure in IMPL_PLAN template to:
   - Fill Technical Context in **zh-TW**.
   - Fill Constitution Check section from constitution.
   - Phase 0: Generate `research.md` (all in **zh-TW**).
   - Phase 1: Generate `data-model.md`, `contracts/`, `quickstart.md` (all in **zh-TW**).
   - Phase 1: Update agent context.

4. **Stop and report**: Report in **zh-TW**.

## Phases

### Phase 0: Outline & Research
1. Consolidate findings in `research.md` (**zh-TW**) using format:
   - 決策 (Decision)
   - 理由 (Rationale)
   - 考慮過的替代方案 (Alternatives)

### Phase 1: Design & Contracts
1. **Extract entities** → `data-model.md` (**zh-TW**):
   - 實體名稱、欄位、關聯。
   - 驗證規則 (包含 YC 邏輯)。
2. **Generate API contracts** (**zh-TW**):
   - REST patterns via FastAPI.
   - Coordinate-based data models for PDF annotations.

## Key rules
- Use absolute paths.
- Mandatory **zh-TW** for all outputs.
- Adhere to memory-only privacy constraints.
"""
